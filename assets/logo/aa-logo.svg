<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="AA Doppler Effect logo">
  <!-- AA logo - ORIGINAL ARTWORK (built-in). Replace this file with your own logo if you like. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="78%">
      <stop offset="0" stop-color="#17397a"/>
      <stop offset="1" stop-color="#050f26"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset=".5" stop-color="#9aa8ba"/>
      <stop offset="1" stop-color="#e9eef6"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#silver)" stroke-width="4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1"/>
  <!-- sound-wave arcs -->
  <g fill="none" stroke="url(#cy)" stroke-linecap="round" stroke-width="3.5">
    <path d="M156 66 A64 64 0 0 1 156 134" opacity=".95"/>
    <path d="M168 58 A76 76 0 0 1 168 142" opacity=".5"/>
    <path d="M44 66 A64 64 0 0 0 44 134" opacity=".95"/>
    <path d="M32 58 A76 76 0 0 0 32 142" opacity=".5"/>
  </g>
  <!-- two separate A letters joined by a sine-wave cross-bar -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#ffffff" stroke-width="8.5">
      <path d="M54 142 L76 70 L98 142"/>
      <path d="M102 142 L124 70 L146 142"/>
    </g>
    <path d="M62 120 q7 -11 14 0 t14 0 t14 0 t14 0 t14 0 t14 0" stroke="#22d3ee" stroke-width="5"/>
  </g>
</svg>
