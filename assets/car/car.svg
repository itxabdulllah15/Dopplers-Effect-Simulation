<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="176" viewBox="0 0 500 176">
  <!-- RED PASSENGER CAR, 2D side view, facing RIGHT. ORIGINAL ARTWORK (built-in placeholder).
       Replace with your own transparent PNG/SVG: keep the car facing right and the wheels touching the bottom edge. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset=".45" stop-color="#e11d2e"/>
      <stop offset="1" stop-color="#9f1020"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e1f5ff"/>
      <stop offset=".55" stop-color="#7cc4ec"/>
      <stop offset="1" stop-color="#3f86b8"/>
    </linearGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".7" stop-color="#b8c2cf"/>
      <stop offset="1" stop-color="#7d8896"/>
    </radialGradient>
    <g id="wheel">
      <circle r="33" fill="#10141b"/>
      <circle r="31" fill="none" stroke="#2a313c" stroke-width="2"/>
      <circle r="22" fill="url(#rim)"/>
      <g stroke="#6b7685" stroke-width="3.2" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-19"/>
        <line x1="0" y1="0" x2="0" y2="-19" transform="rotate(72)"/>
        <line x1="0" y1="0" x2="0" y2="-19" transform="rotate(144)"/>
        <line x1="0" y1="0" x2="0" y2="-19" transform="rotate(216)"/>
        <line x1="0" y1="0" x2="0" y2="-19" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#4b5563"/>
      <circle r="2.4" fill="#e5e7eb"/>
    </g>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="252" cy="171" rx="228" ry="5" fill="#000" opacity=".22"/>

  <!-- main body -->
  <path d="M20 136 C14 134 12 120 15 110 C18 100 26 96 40 95 L128 92 C140 90 150 70 172 52 C186 41 200 38 222 38 L296 38 C318 38 334 44 350 60 L384 90 C420 94 452 98 470 106 C482 111 488 120 487 132 C486 138 482 140 474 140 L20 136 Z" fill="url(#body)"/>
  <!-- lower skirt shade -->
  <path d="M24 126 L482 128 L474 140 L20 136 Z" fill="#6d0a17" opacity=".5"/>
  <!-- character line + roof highlight -->
  <path d="M34 112 C140 104 340 104 482 117" stroke="#ffb0b4" stroke-opacity=".55" stroke-width="2" fill="none"/>
  <path d="M198 42 L294 42" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>

  <!-- windows -->
  <path d="M146 90 C156 70 170 56 190 50 L296 48 C312 48 324 54 336 66 L364 90 Z" fill="url(#glass)"/>
  <path d="M160 86 L190 54 L208 54 L178 86 Z" fill="#fff" opacity=".32"/>
  <rect x="230" y="46" width="12" height="46" fill="#d11a2a"/>

  <!-- door seams and handles -->
  <g stroke="#6d0a17" stroke-opacity=".8" stroke-width="1.6" fill="none">
    <path d="M242 92 L242 136"/>
    <path d="M146 92 L140 134"/>
    <path d="M358 92 L366 136"/>
  </g>
  <rect x="210" y="100" width="22" height="5" rx="2.5" fill="#f3f4f6"/>
  <rect x="264" y="100" width="22" height="5" rx="2.5" fill="#f3f4f6"/>
  <path d="M352 76 L366 74 L368 82 L354 84 Z" fill="#b3121f"/>

  <!-- lights and bumpers -->
  <ellipse cx="482" cy="110" rx="16" ry="9" fill="#fff2a8" opacity=".33"/>
  <path d="M456 100 C468 100 480 104 484 110 L470 114 C464 108 458 104 452 102 Z" fill="#fff7cc" stroke="#f5d26b" stroke-width="1.4"/>
  <path d="M16 104 L30 100 L32 116 L15 118 Z" fill="#7f0a16"/>
  <path d="M19 106 L28 103 L29 112 L18 114 Z" fill="#ff8a80"/>
  <path d="M470 128 L488 128 C489 136 486 141 476 141 L466 141 Z" fill="#2b3340"/>
  <path d="M14 126 L30 128 L30 138 L20 137 Z" fill="#2b3340"/>
  <path d="M440 118 L462 120 L460 126 L438 124 Z" fill="#1d232d" opacity=".8"/>

  <!-- wheel arches -->
  <path d="M78 140 A42 42 0 0 1 162 140 Z" fill="#161b24"/>
  <path d="M343 140 A42 42 0 0 1 427 140 Z" fill="#161b24"/>
  <!-- wheels (bottom of tyres touches y=170) -->
  <use href="#wheel" xlink:href="#wheel" transform="translate(120 137)"/>
  <use href="#wheel" xlink:href="#wheel" transform="translate(385 137)"/>
</svg>
