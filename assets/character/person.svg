<svg xmlns="http://www.w3.org/2000/svg" width="140" height="320" viewBox="0 0 140 320">
  <!-- HUMAN LISTENER, 2D side view, facing RIGHT. ORIGINAL ARTWORK (built-in placeholder).
       Replace with your own transparent PNG/SVG: keep the person facing right and the feet touching the bottom edge. -->
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b7f94"/>
      <stop offset="1" stop-color="#2aa6be"/>
    </linearGradient>
    <linearGradient id="jeans" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22304d"/>
      <stop offset="1" stop-color="#37497a"/>
    </linearGradient>
  </defs>

  <ellipse cx="72" cy="314" rx="48" ry="5" fill="#000" opacity=".22"/>

  <!-- back arm -->
  <path d="M62 102 L52 142 L44 168" stroke="#126072" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="43" cy="174" r="7.5" fill="#d29a79"/>

  <!-- back leg + shoe -->
  <path d="M68 186 L58 244 L46 296" stroke="#1a2540" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M28 300 C27 292 40 290 52 292 L60 300 C60 307 53 309 46 309 L32 309 C29 309 27 305 28 300 Z" fill="#dfe6ee"/>
  <path d="M28 306 L60 306" stroke="#8b97a8" stroke-width="3"/>

  <!-- front leg + shoe -->
  <path d="M80 186 L92 244 L98 294" stroke="url(#jeans)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M86 296 L112 296 C123 298 126 306 117 309 L90 309 C85 309 83 302 86 296 Z" fill="#ffffff"/>
  <path d="M85 306 L121 306" stroke="#8b97a8" stroke-width="3"/>

  <!-- torso (jacket) -->
  <path d="M50 94 C44 124 44 162 48 194 L98 194 C102 162 100 122 94 96 C86 86 58 86 50 94 Z" fill="url(#jacket)"/>
  <path d="M48 190 L98 190" stroke="#126072" stroke-width="4"/>
  <path d="M96 100 L98 188" stroke="#e5f6fa" stroke-width="2" opacity=".7"/>

  <!-- neck + collar -->
  <rect x="62" y="72" width="17" height="22" rx="6" fill="#d29a79"/>
  <path d="M54 95 C60 86 82 86 90 95 L82 102 C74 97 66 97 58 102 Z" fill="#126072"/>

  <!-- head -->
  <ellipse cx="72" cy="50" rx="24" ry="28" fill="#f2c6a6"/>
  <path d="M94 50 L103 58 L94 63 Z" fill="#f2c6a6"/>
  <path d="M47 52 C42 22 66 12 86 20 C98 26 98 38 94 42 C86 34 72 33 63 38 C58 42 61 56 57 68 C50 64 46 58 47 52 Z" fill="#2b1d16"/>
  <ellipse cx="62" cy="55" rx="5" ry="8" fill="#e0aa86"/>
  <circle cx="84" cy="49" r="2.4" fill="#2a1d17"/>
  <path d="M78 41 L90 40" stroke="#2a1d17" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M84 67 C88 69 92 68 94 65" stroke="#b5654f" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- front arm -->
  <path d="M82 104 L90 144 L100 170" stroke="#1f95ab" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="101" cy="177" r="7.5" fill="#f2c6a6"/>
</svg>
